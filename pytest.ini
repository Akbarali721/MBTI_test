[pytest]
pythonpath = .
testpaths = tests

# Ro'yxatdan o'tmagan marker jimgina o'tib ketmasin (xato yozilgan -m filtri
# butun to'plamni "0 passed" bilan yashirib qo'yardi).
strict_markers = true
strict_config = true

markers =
    slow: sekin testlar (alohida jarayonda alembic migratsiyalari ishga tushadi)
