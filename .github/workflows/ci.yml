name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # `mypy app` toza (0 xato) — endi u CI ni yiqitadi, aks holda tiplar sekin-asta buziladi.
      - name: mypy
        run: mypy app

      - name: pytest
        env:
          DATABASE_URL: "sqlite://"
          SECRET_KEY: ci-secret-key
        run: pytest -q --cov=app

  migrations:
    name: alembic upgrade head (sqlite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Migratsiya zanjiri uzilmaganini bo'sh bazada tekshiradi.
      - name: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
          SECRET_KEY: ci-secret-key
        run: alembic upgrade head

      # Butun zanjir orqaga ham qaytadi (001 gacha) — rollback yo'li ishlashi tekshiriladi.
      - name: alembic downgrade base
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
          SECRET_KEY: ci-secret-key
        run: alembic downgrade base
