<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Xarakter testi{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  {% block bootstrap_css %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', path='css/personality.css') }}?v=12">
  <link rel="stylesheet" href="{{ url_for('static', path='css/personality-marketing.css') }}?v=20">
  {% block extra_css %}{% endblock %}
</head>
<body class="personality-body {% block body_class %}{% endblock %}">
  <main class="{% block main_class %}container personality-container py-4{% endblock %} {% block theme_wrapper_class %}{% endblock %}">
    {% block theme_decor %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
  {% block bootstrap_js %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
