<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} — MBTI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; min-height: 100vh; }
    .admin-nav { background: #1a2744; }
    .admin-nav .navbar-brand, .admin-nav .nav-link { color: rgba(255,255,255,.9) !important; }
    .admin-nav .nav-link.active { font-weight: 600; color: #fff !important; }
    .stat-card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark admin-nav mb-4">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand" href="/admin">MBTI Admin</a>
      <button class="navbar-toggler border-light" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="adminNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link {% if active_nav == 'dashboard' %}active{% endif %}" href="/admin">Bosh sahifa</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active_nav == 'sessions' %}active{% endif %}" href="/admin/sessions">Sessiyalar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if active_nav == 'premium' %}active{% endif %}" href="/admin/premium-requests">Premium so‘rovlar</a>
          </li>
        </ul>
        <a class="nav-link" href="/admin/logout">Chiqish</a>
      </div>
    </div>
  </nav>
  <main class="container-fluid px-3 px-lg-4 pb-5">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
